<!DOCTYPE html>
<html lang="es-ES">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $site := resources.Get "js/site.js" }}
  {{ $siteMin := $site | js.Build (dict "minify" true) | fingerprint }}
  <script src="{{ $siteMin.RelPermalink }}" integrity="{{ $siteMin.Data.Integrity }}" defer></script>
</body>
</html>
