{{ define "main" }}
<section id="detalle" class="pagina-detalle">
  <div class="section__inner section__inner--narrow">
    {{ with .Params.kicker }}<p class="kicker reveal">{{ . }}</p>{{ end }}
    <h1 class="section__title reveal">{{ .Params.h1 | default .Title }}</h1>

    {{ range $i, $p := .Params.parrafos }}
    <p class="sobre-mi__bio reveal" style="transition-delay: {{ mul $i 60 }}ms">{{ $p }}</p>
    {{ end }}

    {{ with .Params.cta }}<a href="/#contacto" class="btn btn--primary reveal">{{ . }}</a>{{ end }}
  </div>
</section>
{{ end }}
