- pregunta: "¿Cuál es la diferencia entre un análisis de vulnerabilidades y un pentest?"
  respuesta: >
    El análisis de vulnerabilidades identifica y clasifica fallos —con validación manual
    para descartar falsos positivos—, pero no los explota. El pentest (test de intrusión)
    va un paso más allá: explota esos fallos de forma controlada para demostrar hasta
    dónde llegaría un atacante real, con una cadena de ataque reproducible. Según tu
    caso, uno u otro —o los dos combinados— tiene más sentido.

- pregunta: "¿Qué pentest necesito para la ISO 27001?"
  respuesta: >
    Yo no soy consultor de ISO 27001 ni llevo la certificación —eso lo lleva tu
    consultor de cumplimiento—, pero sí ejecuto la parte técnica que el auditor suele
    pedir como evidencia: un análisis de vulnerabilidades y/o un test de intrusión sobre
    tu infraestructura o tus aplicaciones, documentado y trazable. Coordíname con tu
    consultor y encajamos el alcance con lo que necesita la auditoría.

- pregunta: "¿Qué test de intrusión pide el ENS?"
  respuesta: >
    El Esquema Nacional de Seguridad exige, según la categoría del sistema, auditorías
    técnicas periódicas que incluyen análisis de vulnerabilidades y test de intrusión.
    Igual que con la ISO 27001, yo pongo la evidencia técnica —el pentest y su informe—;
    la interpretación normativa y la auditoría de certificación las lleva tu consultor
    o entidad certificadora.

- pregunta: "¿Cuánto dura un pentest?"
  respuesta: >
    Depende del alcance: número de hosts o aplicaciones, si hay dominio Active Directory
    de por medio, y si el test es externo o interno. Te doy un plazo cerrado en cuanto
    conozco ese alcance —normalmente hablamos de días para un análisis de
    vulnerabilidades y de una a varias semanas para un test de intrusión completo.

- pregunta: "¿Trabajas en modalidad marca blanca o para consultoras?"
  respuesta: >
    Sí. Trabajo como pentester freelance, tanto de forma directa para empresas como en
    modalidad marca blanca para consultoras que necesitan reforzar su capacidad técnica
    de pentesting sin ampliar plantilla. El informe y el trato pueden adaptarse a tu
    marca si lo necesitas.

- pregunta: "¿También haces páginas web?"
  respuesta: >
    Sí. Diseño y desarrollo páginas web a medida, y las construyo con la misma
    perspectiva con la que hago pentesting: sé cómo se atacan, así que la seguridad va
    integrada desde el diseño, no añadida al final. Si necesitas una web nueva o un
    rediseño con esa base, cuéntame qué tienes en mente.
