servicios_bloques:
  ciberseguridad:
    numero: "1"
    titulo: "Ciberseguridad"
    kicker: >
      ¿Te exigen ISO 27001, ENS o NIS2, o simplemente quieres mejorar tu ciberseguridad y
      la de tu empresa? Esas pruebas técnicas reales no se hacen solas, y sin un ofensivo
      en plantilla, esa parte se queda coja. La cubro yo.
  paginas_web:
    numero: "2"
    titulo: "Páginas web que venden"
    parrafos:
      - >
        Tienes un negocio local y o no tienes web, o tienes una que nadie encuentra, o
        que la gente visita y se va sin llamar. El problema no es "no queda bonita" — el
        problema es que no está vendiendo nada.
      - >
        Cada día que pasa así, tu competencia se lleva al cliente que te tocaba a ti:
        aparece antes en Google cuando alguien busca lo que tú ofreces, o simplemente
        tiene una web que convierte esa visita en una llamada y la tuya no. Una web que
        solo "da buena imagen" no te soluciona eso; te cuesta clientes en silencio, sin
        que lo veas reflejado en ningún sitio salvo en la caja.
      - >
        Yo te diseño y desarrollo una web a medida —nada de plantillas genéricas—
        pensada para vender, no solo para lucir bien: estrategia SEO real para que te
        encuentren cuando te buscan, y un diseño visual pensado para convertir esa
        visita en cliente, no solo para dar buena impresión. Y la construyo con la misma
        cabeza con la que audito: sé cómo se ataca una web, así que sé qué cerrar antes
        de que sea un problema — la seguridad está en el diseño desde el primer día, no
        añadida al final como checklist de marketing.
    entrega: "web a medida, con estrategia SEO y diseño orientado a conversión, con las medidas de seguridad aplicadas desde el desarrollo. 1.500€, en 1-2 días."

servicios_ciberseguridad:
  - titulo: "Análisis de vulnerabilidades"
    icono: "scan"
    descripcion: >
      Reviso tu infraestructura o tus aplicaciones web y te digo qué es explotable de
      verdad —no una lista de escáner llena de ruido—, priorizado por el riesgo real
      para tu negocio.
    entrega: "informe claro con el plan de corrección, ordenado por lo que más te protege."
    orientativo: ""
  - titulo: "Test de intrusión (pentesting)"
    icono: "exploit"
    descripcion: >
      Voy un paso más allá: exploto de forma controlada para demostrar hasta dónde
      llegaría un atacante real, paso a paso. Sobre infraestructura interna, Active
      Directory y aplicaciones web.
    entrega: "informe con la cadena de ataque reproducible y cómo cerrarla."
    orientativo: ""
  - titulo: "Test de phishing (ingeniería social)"
    icono: "phishing"
    descripcion: >
      Puedes tener el perímetro blindado y aun así basta un clic en el correo equivocado
      para que un atacante esté dentro —y ese es precisamente el vector que más se usa
      para entrar de verdad, no el exploit sofisticado. Simulo campañas de phishing
      controladas y realistas para medir ese punto ciego antes de que lo aproveche
      alguien que no te va a avisar.
    entrega: "informe con la tasa de exposición por equipo/departamento y un plan de concienciación priorizado."
    orientativo: ""
  - titulo: "Retest de remediación"
    icono: "shield"
    descripcion: >
      Compruebo que lo que arreglaste queda cerrado de verdad y te lo dejo por escrito.
      El cierre lógico de cualquier auditoría.
    entrega: ""
    orientativo: ""
  - titulo: "Cumplimiento y auditoría — la parte técnica"
    icono: "compliance"
    descripcion: >
      ¿Vas hacia una ISO 27001, el ENS o NIS2? Esas normas exigen probar tu seguridad de
      forma técnica, no solo sobre papel. Ahí encaja un pentest para ISO 27001, un test
      de intrusión para el ENS o un análisis de vulnerabilidades para NIS2: te doy la
      evidencia técnica que pide el auditor, documentada. La consultoría y la
      certificación las lleva tu consultor de cumplimiento; yo pongo la prueba técnica.
    entrega: ""
    orientativo: ""
  - titulo: "Copias de seguridad (backup)"
    icono: "backup"
    discreto: true
    descripcion: >
      Un pentest te dice qué puede fallar; esto te asegura que, si algo falla
      igualmente, no lo pierdes todo. Reviso o implemento una estrategia de copias de
      seguridad que de verdad puedas restaurar cuando la necesites —no un backup que
      solo existe sobre el papel.
    entrega: "sistema de copias de seguridad probado y documentado, con su plan de restauración."
    orientativo: ""

proceso:
  - "Alcance y presupuesto cerrados y personalizados antes de empezar. Pagas por lo acordado; sin sorpresas a mitad de camino."
  - "Metodología reconocida (PTES, OWASP) y validación manual: solo te reporto lo que es explotable de verdad, con su prueba — no la salida de un escáner."
  - "Cada hallazgo, con su riesgo y su solución, priorizado por lo que de verdad te protege."
  - "Siempre dos lecturas del mismo informe: una ejecutiva para dirección y una técnica para tu equipo."

estandares:
  - "PTES"
  - "OWASP"
  - "CVSS"
  - "MITRE ATT&CK"
  - "ENS"
  - "CIS"

