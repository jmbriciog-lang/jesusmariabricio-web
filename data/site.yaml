servicios:
  - titulo: "Análisis de vulnerabilidades"
    icono: "scan"
    descripcion: >
      Reviso tu infraestructura o tus aplicaciones web y te digo qué es explotable de
      verdad —no una lista de escáner llena de ruido—, priorizado por el riesgo real
      para tu negocio.
    entrega: "informe claro con el plan de corrección, ordenado por lo que más te protege."
    orientativo: ""
    enlace: "/ciberseguridad/"
  - titulo: "Test de intrusión (pentesting)"
    icono: "exploit"
    descripcion: >
      Voy un paso más allá: exploto de forma controlada para demostrar hasta dónde
      llegaría un atacante real, paso a paso. Sobre infraestructura interna, Active
      Directory y aplicaciones web.
    entrega: "informe con la cadena de ataque reproducible y cómo cerrarla."
    orientativo: ""
    enlace: "/ciberseguridad/"
  - titulo: "Retest de remediación"
    icono: "shield"
    descripcion: >
      Compruebo que lo que arreglaste queda cerrado de verdad y te lo dejo por escrito.
      El cierre lógico de cualquier auditoría.
    entrega: ""
    orientativo: ""
    enlace: "/ciberseguridad/"
  - titulo: "Cumplimiento y auditoría — la parte técnica"
    icono: "compliance"
    descripcion: >
      ¿Vas hacia una ISO 27001, el ENS o NIS2? Esas normas exigen probar tu seguridad de
      forma técnica, no solo sobre papel. Ahí encaja un pentest para ISO 27001, un test
      de intrusión para el ENS o un análisis de vulnerabilidades para NIS2: te doy la
      evidencia técnica que pide el auditor, documentada. La consultoría y la
      certificación las lleva tu consultor de cumplimiento; yo pongo la prueba técnica.
    entrega: ""
    orientativo: ""
    enlace: "/ciberseguridad/"
  - titulo: "Diseño y desarrollo de páginas web personalizadas y securizadas"
    icono: "shield"
    descripcion: >
      Diseño y desarrollo tu web a medida —nada de plantillas genéricas— y la construyo
      con la misma cabeza con la que audito: sé cómo se ataca una web, así que sé qué
      cerrar antes de que sea un problema. La seguridad no se añade al final como
      checklist de marketing, está en el diseño desde el primer día.
    entrega: "web a medida, con las medidas de seguridad aplicadas desde el desarrollo."
    orientativo: ""
    enlace: "/paginas-web/"

proceso:
  - "Alcance y presupuesto cerrados y personalizados antes de empezar. Pagas por lo acordado; sin sorpresas a mitad de camino."
  - "Metodología reconocida (PTES, OWASP) y validación manual: solo te reporto lo que es explotable de verdad, con su prueba — no la salida de un escáner."
  - "Cada hallazgo, con su riesgo y su solución, priorizado por lo que de verdad te protege."
  - "Siempre dos lecturas del mismo informe: una ejecutiva para dirección y una técnica para tu equipo."

estandares:
  - "PTES"
  - "OWASP"
  - "CVSS"
  - "MITRE ATT&CK"
  - "ENS"
  - "CIS"

