    rol: "Freelance — auditorías de seguridad ofensiva"
    detalle: "para empresas y consultoras."
  - periodo: ""
    rol: "Pentester por cuenta ajena en una empresa de ciberseguridad"
    detalle: "pentesting de infraestructura y web, compromiso de red interna y Active Directory, con informes mapeados a MITRE ATT&CK y CWE."
  - periodo: ""
