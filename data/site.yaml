servicios:
  - titulo: "Análisis de vulnerabilidades"
    icono: "scan"
    descripcion: >
      Reviso tu web o tu red y te digo qué es explotable de verdad —no una lista de
      escáner llena de ruido—, priorizado por el riesgo real para tu negocio.
    entrega: "informe claro con el plan de corrección, ordenado por lo que más te protege."
    orientativo: ""
  - titulo: "Test de intrusión (pentesting)"
    icono: "exploit"
    descripcion: >
      Voy un paso más allá: exploto de forma controlada para demostrar hasta dónde
      llegaría un atacante real, paso a paso. Mi terreno fuerte: infraestructura interna
      y Active Directory.
    entrega: "informe con la cadena de ataque reproducible y cómo cerrarla."
    orientativo: ""
  - titulo: "Retest de remediación"
    icono: "shield"
    descripcion: >
      Compruebo que lo que arreglaste queda cerrado de verdad y te lo dejo por escrito.
      El cierre lógico de cualquier auditoría.
    entrega: ""
    orientativo: ""
  - titulo: "Cumplimiento y auditoría — la parte técnica"
    icono: "compliance"
    descripcion: >
      ¿Vas hacia una ISO 27001, el ENS o NIS2? Esas normas te exigen probar tu seguridad
      de forma técnica, no solo sobre papel. Ahí encajan mi análisis de vulnerabilidades y
      mi pentesting: te doy la evidencia que pide el auditor y te la documento. La
      consultoría y la certificación las lleva tu consultor de cumplimiento; yo pongo la
      prueba técnica.
    entrega: ""
    orientativo: ""

proceso:
  - "Alcance y presupuesto cerrados y personalizados antes de empezar. Pagas por lo acordado; sin sorpresas a mitad de camino."
  - "Metodología reconocida (PTES, OWASP) y validación manual: solo te reporto lo que es explotable de verdad, con su prueba — no la salida de un escáner."
  - "Cada hallazgo, con su riesgo y su solución, priorizado por lo que de verdad te protege."
  - "Siempre dos lecturas del mismo informe: una ejecutiva para dirección y una técnica para tu equipo."

estandares:
  - "PTES"
  - "OWASP"
  - "CVSS"
  - "MITRE ATT&CK"
  - "ENS"
  - "CIS"

trayectoria:
